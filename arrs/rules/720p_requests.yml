mediaType: SEASONS
rules:
  - "0":
      - firstValue: Plex.sw_collection_names_including_parent
        action: NOT_CONTAINS
        customValue:
          type: text
          value: Archive
      - operator: AND
        firstValue: Sonarr.qualityProfileName
        action: EQUALS
        customValue:
          type: text
          value: 720p
      - operator: AND
        firstValue: Sonarr.unaired_episodes
        action: EQUALS
        customValue:
          type: boolean
          value: "false"
      - operator: AND
        firstValue: Sonarr.missing_episodes_season
        action: EQUALS
        customValue:
          type: number
          value: 0
  - "1":
      - operator: AND
        firstValue: Tautulli.sw_watchers
        action: COUNT_BIGGER
        customValue:
          type: number
          value: 0
      - operator: AND
        firstValue: Tautulli.sw_allEpisodesSeenBy
        action: CONTAINS_ALL
        lastValue: Tautulli.sw_watchers
      - operator: OR
        firstValue: Tautulli.lastViewedAt
        action: BEFORE
        customValue:
          type: custom_days
          value: "76"
  - "2":
      - operator: OR
        firstValue: Plex.sw_collection_names_including_parent
        action: NOT_CONTAINS
        customValue:
          type: text
          value: Archive
      - operator: AND
        firstValue: Sonarr.qualityProfileName
        action: EQUALS
        customValue:
          type: text
          value: 720p
      - operator: AND
        firstValue: Sonarr.unaired_episodes
        action: EQUALS
        customValue:
          type: boolean
          value: "false"
      - operator: AND
        firstValue: Sonarr.missing_episodes_season
        action: EQUALS
        customValue:
          type: number
          value: 0
      - operator: AND
        firstValue: Tautulli.sw_lastWatched
        action: NOT_EXISTS
      - operator: AND
        firstValue: Plex.sw_lastWatched
        action: NOT_EXISTS
      - operator: AND
        firstValue: Plex.sw_lastEpisodeAddedAt
        action: BEFORE
        customValue:
          type: custom_days
          value: "76"

