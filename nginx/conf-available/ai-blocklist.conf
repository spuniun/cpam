map $http_user_agent $ai_scraper {
    default                                     0;

    # OpenAI
    "~*(?:GPTBot|ChatGPT-User|OAI-SearchBot)"   1;
    # Anthropic
    "~*(?:ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|Claude-Web)" 1;
    # Perplexity
    "~*(?:PerplexityBot|Perplexity-User)"       1;
    # Meta
    "~*(?:meta-externalagent|meta-externalfetcher|FacebookBot)" 1;
    # Bytedance / Huawei / Amazon / Apple
    "~*(?:Bytespider|TikTokSpider|PetalBot|Amazonbot|Applebot-Extended)" 1;
    # Google (Gemini training fetcher; Google-Extended is robots-token-only)
    "~*(?:Google-CloudVertexBot|GoogleOther)"   1;
    # Mistral / Cohere / AI2 / You / DuckDuckGo
    "~*(?:MistralAI-User|cohere-ai|cohere-training-data-crawler|AI2Bot|YouBot|DuckAssistBot)" 1;
    # Datasets & scraping-as-a-service
    "~*(?:CCBot|Diffbot|ImagesiftBot|omgili|omgilibot|Timpibot|img2dataset|FirecrawlAgent|Scrapy)" 1;
    # SEO/AI hybrids
    "~*(?:SemrushBot-OCOB|SemrushBot-SWA)"      1;

    # Empty or generic library UAs hitting an app endpoint
    ""                                          1;
    "~*^(?:python-requests|curl|Go-http-client|libwww-perl|node-fetch|axios)" 1;
}

log_format ai_block '$remote_addr - [$time_local] "$request" '
                    '$status "$http_user_agent" "$http_x_forwarded_for"';
